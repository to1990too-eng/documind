[project]
name = "documind"
version = "0.1.0"
description = "RAG-система для вопросов по PDF-документам (локальные эмбеддинги, без внешних API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Настройки
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # RAG / LangChain
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-chroma>=0.1.4",
    "chromadb>=0.5.0",
    # Локальные эмбеддинги
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    # Парсинг PDF
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]